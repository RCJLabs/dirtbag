<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dirtbag store art</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #15161a;
        color: #e9e4d8;
        font: 14px sans-serif;
      }
      figure {
        display: inline-block;
        margin: 0 8px 12px 0;
        width: 460px;
        vertical-align: top;
      }
      canvas {
        display: block;
        width: 100%;
      }
      /* The library's logo has no background of its own: shown on a check, as an editor would. */
      canvas.clear {
        background: repeating-conic-gradient(#3a3b40 0 25%, #2a2b30 0 50%) 0 0 / 24px 24px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/dev/store.ts"></script>
  </body>
</html>
