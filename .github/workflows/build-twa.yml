# Builds the Android App Bundle (.aab) for the Play (TWA) wrapper around dirtbag.rcjlabs.com.
# Run it from the Actions tab: "Build TWA (AAB)" -> "Run workflow".
#
# versionName is package.json's version (`npm run stamp` keeps twa-manifest.json in step).
# versionCode is minutes since Nov 2023, so every build is strictly greater than any bundle
# already uploaded; Play rejects anything that isn't.
#
# The toolchain is pinned by twa/package-lock.json (Bubblewrap CLI and core 1.25.0). Core owns the
# Android template, so the build asserts the template's targetSdkVersion against Play's floor.
name: Build TWA (AAB)

on:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and upload the bundle (off = toolchain check only; no secrets are read)'
        type: boolean
        default: true

env:
  # Google Play: since 31 Aug 2026, new apps and app updates must target Android 16 (API 36).
  # Raise this when Play raises the floor (announced each year, enforced each August).
  MIN_TARGET_SDK: 36

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: twa/package-lock.json

      - name: Set up JDK 17 (Bubblewrap 1.25 rejects any other JDK)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned Bubblewrap
        run: npm ci --prefix twa

      - name: Point Bubblewrap at the runner's JDK and SDK (so it doesn't download them)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{ "jdkPath": "%s", "androidSdkPath": "%s" }\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Set the version (name from package.json, code from the clock)
        run: |
          VN=$(node -p "require('./package.json').version")
          VC=$(( ($(date +%s) - 1700000000) / 60 ))
          # shellcheck disable=SC2016 # single quotes on purpose: the ${...} below are JS, not shell
          node -e '
            const fs = require("fs");
            const [name, code] = process.argv.slice(1);
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            if (m.appVersionName !== name) {
              console.error(`::error::twa-manifest.json says ${m.appVersionName} but package.json says ${name}. Run npm run stamp and commit.`);
              process.exit(1);
            }
            m.appVersionCode = Number(code);
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
          ' "$VN" "$VC"
          echo "versionName $VN, versionCode $VC" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate the Android project (fetches icons from the live site)
        run: twa/node_modules/.bin/bubblewrap update --skipVersionUpgrade

      - name: Assert targetSdkVersion meets Play's floor
        run: |
          sdk=$(grep -oE 'targetSdkVersion[[:space:]]+[0-9]+' app/build.gradle | grep -oE '[0-9]+$' || true)
          echo "targetSdkVersion ${sdk:-missing} (Play requires $MIN_TARGET_SDK+)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$sdk" ] || [ "$sdk" -lt "$MIN_TARGET_SDK" ]; then
            echo "::error::targetSdkVersion ${sdk:-missing} is below $MIN_TARGET_SDK; Play will reject this bundle"
            exit 1
          fi

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build the release bundle
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Sign the .aab with the upload key
        if: inputs.sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          jarsigner -keystore android.keystore \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -signedjar dirtbag-release.aab \
            app/build/outputs/bundle/release/app-release.aab \
            dirtbag
          rm -f android.keystore
          ls -la dirtbag-release.aab

      - name: Upload the signed .aab
        if: inputs.sign
        uses: actions/upload-artifact@v7
        with:
          name: dirtbag-aab
          path: dirtbag-release.aab
