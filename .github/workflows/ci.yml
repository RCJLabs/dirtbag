# Runs on every push and PR. Three jobs:
#   check  the site as it would ship: the game built, one version everywhere, every referenced
#          file there, the download size, then the staged site booted in headless Chromium (a
#          new climber, the save, the clock, reload, offline start); and the Play app's purchase
#          acknowledger hooked into Bubblewrap's own templates.
#   app    the game in app/: formatting, types, the sim's tests, a build inside its size
#          budget, then a bot that plays the first five days on the build, and a v0.956 player;
#          then the demo: a bot plays it to its end, it's built, the build is checked for any
#          of the full game's content, and its first morning and last card are played; then
#          the full game with its gate on (Phase 19.1), from both sides of it.
#   desktop  the desktop build (Electron, pinned in desktop/): its save file's tests, then its
#          first minute under a virtual display (opens, saves to the file, comes back, quits).
# Failure screenshots from either are kept as run artifacts.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            twa/package-lock.json

      - run: npm ci && npm ci --prefix app

      - name: Build the game
        run: npm run build --prefix app

      - name: Static checks (one version, the build whole, the Play domain link)
        run: npm run check

      # Phase 19.2: the purchase acknowledger hooks into the project Bubblewrap generates.
      - name: The Play app's acknowledger, on Bubblewrap's own templates
        run: npm ci --prefix twa && node --test twa/acknowledge.test.mjs

      - name: Size report
        run: npm run size

      - name: Stage the site (allowlisted files only)
        run: npm run stage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the staged site
        run: npm run smoke

      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: ignore

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # The app's own tools, plus the repo root's pinned Playwright for the playthrough.
      - run: npm ci && npm ci --prefix ..

      - name: Formatting
        run: npm run format:check

      - name: Types (the sim is checked without the DOM)
        run: npm run typecheck

      - name: Sim tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run size

      - name: Install Chromium
        run: ../node_modules/.bin/playwright install --with-deps chromium

      - name: Play the first day
        run: npm run e2e

      # Phase 14.5: the demo, built from the same code with its flag, from both ends.
      - name: The demo's bot plays it to its end
        run: npm run play:demo

      - name: Build the demo
        run: npm run build:demo

      # Phase 14.5b (Done-when 4): the content diff.
      - name: The demo holds none of the full game's content
        run: npm run diff:demo

      - name: The demo's first morning and last card
        run: npm run e2e:demo

      # Phase 19.1: the full game with its gate on, as the site will be at launch.
      - name: Build the game with its gate on
        run: npm run build:gated

      - name: The gate lets the climbers from before through, and holds the rest
        run: npm run e2e:gate

      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-artifacts
          path: app/e2e-artifacts/
          if-no-files-found: ignore

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            desktop/package-lock.json

      # Electron's own download, about 100 MB, kept between runs by its pinned version.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('desktop/package-lock.json') }}

      # The game, the desktop's pinned Electron, and the root's Playwright that drives it.
      - run: npm ci && npm ci --prefix app && npm ci --prefix desktop

      - name: Build the game
        run: npm run build --prefix app

      - name: The save file's tests
        run: npm test --prefix desktop

      # Chromium's libraries, and the user namespaces its sandbox needs, which Ubuntu 24.04's
      # AppArmor holds back by default: the smoke runs sandboxed, as a player's copy does.
      - name: Let Electron run here
        run: |
          npx playwright install-deps chromium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Play the first minute in the desktop build
        run: xvfb-run -a npm run smoke --prefix desktop

      # Phase 15.3: the demo's edition of the same desktop code, on the demo's build.
      - name: Build the demo
        run: npm run build:demo --prefix app

      - name: Play the demo's first minute in the desktop build
        run: xvfb-run -a npm run smoke:demo --prefix desktop
